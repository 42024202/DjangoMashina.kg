{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Создать аккаунт</title>

  <!-- Bootstrap и шрифт -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f8f9fa;
      padding-top: 50px;
    }

    .register-container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
    }

    .messages {
      position: fixed;
      top: 20px;
      right: 20px;
      list-style: none;
      margin: 0;
      padding: 0;
      z-index: 1000;
    }

    .messages li {
      min-width: 250px;
      margin-bottom: 10px;
      padding: 15px 20px;
      border-left: 5px solid;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      color: #333;
      opacity: 1;
      transition: opacity 0.5s ease-in-out;
    }

    .messages li.success { border-color: #28a745; }
    .messages li.info    { border-color: #17a2b8; }
    .messages li.warning { border-color: #ffc107; }
    .messages li.error   { border-color: #dc3545; }
  </style>
</head>
<body>

  {% if messages %}
    <ul class="messages">
      {% for message in messages %}
        <li class="{{ message.tags }}">
          {{ message }}
        </li>
      {% endfor %}
    </ul>
  {% endif %}

  <div class="register-container">
    <h2 class="mb-4 text-center">Регистрация</h2>

    <form method="post" novalidate>
      {% csrf_token %}

      {% for field in form %}
        <div class="mb-3">
          <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div class="text-danger small">
              {{ field.errors|striptags }}
            </div>
          {% endif %}
        </div>
      {% endfor %}

      <button type="submit" class="btn btn-primary w-100">Создать аккаунт</button>
    </form>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function(){
      setTimeout(function(){
        document.querySelectorAll('.messages li').forEach(function(el){
          el.style.opacity = '0';
          setTimeout(function(){ el.remove(); }, 500);
        });
      }, 5000);
    });
  </script>

</body>
</html>
