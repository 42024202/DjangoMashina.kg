{% extends "base.html" %}
{% load static %}
{% block content %}
<h2>Чат с {{ other_user.username }}</h2>

<meta name="csrf-token" content="{{ csrf_token }}">

<div id="messages" style="border:1px solid #ccc; padding:10px; max-height:400px; overflow-y:scroll;"></div>

<form id="message-form">
    <input type="text" id="message-text" placeholder="Введите сообщение..." style="width:80%;" required>
    <button type="submit">Отправить</button>
</form>

<script>
const chatId = "{{ chat.id }}";
const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

// Функция загрузки сообщений
async function loadMessages() {
    try {
        const resp = await fetch(`/api/messages_app/chats-api/${chatId}/messages/`);
        if (!resp.ok) throw new Error("Ошибка загрузки сообщений");
        const data = await resp.json();

        const container = document.getElementById("messages");
        container.innerHTML = data.map(msg =>
            `<p><b>${msg.sender.username}</b>: ${msg.text}</p>`
        ).join('');
        container.scrollTop = container.scrollHeight;
    } catch (err) {
        console.error(err);
    }
}

// Отправка нового сообщения
document.getElementById("message-form").addEventListener("submit", async e => {
    e.preventDefault();
    const text = document.getElementById("message-text").value.trim();
    if (!text) return;

    try {
        const resp = await fetch(`/api/messages_app/chats-api/${chatId}/messages/send/`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken,
            },
            body: JSON.stringify({ text }),  // убедись, что сериализатор ожидает поле text
        });

        const respData = await resp.json();

        if (resp.ok) {
            document.getElementById("message-text").value = "";
            await loadMessages();
        } else {
            alert(respData.error || respData.detail || "Не удалось отправить сообщение");
        }
    } catch (err) {
        console.error(err);
    }
});

// Первичная загрузка + автообновление каждые 3 секунды
loadMessages();
setInterval(loadMessages, 3000);
</script>
{% endblock %}
